    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-stubs (==3.18.2)",
    "django-extensions (>=4.1,<5.0)",
    "product (>=0.1.1.1,<0.2.0.0)",
    "user-data (>=0.1.0,<0.2.0)",
    "django-debug-toolbar (>=8.0.0,<9.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "gitpython (>=3.2.1,<4.0.0)"
